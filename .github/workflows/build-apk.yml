name: Build JAVI Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install offline Spanish wake-word model
        run: |
          set -euxo pipefail
          rm -rf app/src/main/assets/model-es app/src/main/assets/vosk-model-small-es-0.42
          mkdir -p app/src/main/assets
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o /tmp/vosk-es.zip
          unzip -q /tmp/vosk-es.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-es-0.42 app/src/main/assets/model-es
          # Vosk StorageService.unpack() requires a uuid marker inside the asset model.
          # Official Vosk Android model builds generate this file during preBuild.
          printf '%s\n' "javi-es-0.42-v2" > app/src/main/assets/model-es/uuid
          test -s app/src/main/assets/model-es/uuid
          test -s app/src/main/assets/model-es/am/final.mdl
          test -s app/src/main/assets/model-es/conf/model.conf
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Validate release bundle
        run: gradle bundleRelease --stacktrace
      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JAVI-Assistant-v0.14-local-wake-fixed.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JAVI-Assistant-v0.14-local-wake-fixed
          path: JAVI-Assistant-v0.14-local-wake-fixed.apk
          if-no-files-found: error
