name: Build JAVI Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Validate release bundle
        run: gradle bundleRelease --stacktrace
      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JAVI-Assistant-v0.11-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JAVI-Assistant-v0.11-debug
          path: JAVI-Assistant-v0.11-debug.apk
          if-no-files-found: error
