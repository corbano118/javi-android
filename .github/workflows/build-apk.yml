name: Build A&M Sports Android

on:
  workflow_dispatch:
  push:
    branches: [am-sports-public]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: am-sports
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle assembleDebug --stacktrace
      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AM-Sports-v1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-Sports-v1.0.0
          path: am-sports/AM-Sports-v1.0.0.apk
          if-no-files-found: error
